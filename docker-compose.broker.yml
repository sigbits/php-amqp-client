services:
  qpid:
    image: apache/qpid-broker-j:latest
    environment:
      QPID_ADMIN_USER: guest
      QPID_ADMIN_PASSWORD: guest
    ports:
      - "56720:5672"
      - "58080:8080"

  artemis:
    image: apache/artemis:latest-alpine
    environment:
      ARTEMIS_USER: guest
      ARTEMIS_PASSWORD: guest
      ANONYMOUS_LOGIN: "false"
    ports:
      - "56730:5672"
      - "58161:8161"

  artemis-tls:
    image: haproxy:3.0-alpine
    depends_on:
      - artemis
    volumes:
      - ./docker/broker/haproxy-artemis-tls.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./docker/broker/tls:/usr/local/etc/haproxy/certs:ro
    ports:
      - "56731:5671"

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "56740:5672"
      - "58172:15672"

  rabbitmq-tls:
    image: haproxy:3.0-alpine
    depends_on:
      - rabbitmq
    volumes:
      - ./docker/broker/haproxy-rabbitmq-tls.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./docker/broker/tls:/usr/local/etc/haproxy/certs:ro
    ports:
      - "56741:5671"

  servicebus-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Sigbits_ServiceBus_Emulator_2026!
    ports:
      - "51433:1433"

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    platform: linux/amd64
    depends_on:
      - servicebus-sql
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: servicebus-sql
      MSSQL_SA_PASSWORD: Sigbits_ServiceBus_Emulator_2026!
    volumes:
      - ./docker/broker/servicebus-emulator-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "56750:5672"
      - "58300:5300"

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - "58474:8474"
