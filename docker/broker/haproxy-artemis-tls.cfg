global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend artemis_amqps
    bind *:5671 ssl crt /usr/local/etc/haproxy/certs/artemis-tls.pem
    default_backend artemis_amqp

backend artemis_amqp
    server artemis artemis:5672 check
