global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend rabbitmq_amqps
    bind *:5671 ssl crt /usr/local/etc/haproxy/certs/rabbitmq-tls.pem
    default_backend rabbitmq_amqp

backend rabbitmq_amqp
    server rabbitmq rabbitmq:5672 check
