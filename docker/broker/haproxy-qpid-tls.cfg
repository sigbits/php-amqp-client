global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend qpid_amqps
    bind *:5671 ssl crt /usr/local/etc/haproxy/certs/qpid-tls.pem
    default_backend qpid_amqp

backend qpid_amqp
    server qpid qpid:5672 check
