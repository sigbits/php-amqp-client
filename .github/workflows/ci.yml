name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.3'
          - '8.4'
          - '8.5'

    env:
      PHP_VERSION: ${{ matrix.php-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PHP container
        run: docker compose build php

      - name: Validate Composer metadata
        run: docker compose run --rm php composer validate --strict --no-check-lock

      - name: Install dependencies
        run: docker compose run --rm php composer install --prefer-dist --no-interaction --no-progress

      - name: Check coding standards
        run: docker compose run --rm php composer cs

      - name: Run static analysis
        run: docker compose run --rm php composer stan

      - name: Run tests
        run: docker compose run --rm php composer test
